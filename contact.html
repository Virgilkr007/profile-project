<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me - Oluwakorede Adeogun</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page">

<div class="contact-info">
    <h1 class="name">Oluwakorede Adeogun</h1>
    <p class="detail"><strong>Department:</strong> Computer Science</p>
    <p class="detail"><strong>Email:</strong> oadeogun243431@stu.ui.edu.ng</p>
    <p class="detail"><strong>Address:</strong> Sultan Bello Hall, University of Ibadan</p>
</div>

<section class="contact-form-section">
    <h2 class="section-heading">Get In Touch</h2>
    <form class="contact-form" action="#" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="submit-button">Submit</button>
    </form>
</section>

</body>
</html>
